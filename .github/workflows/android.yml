name: Build Native Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Deep Clean and Install
        run: |
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps --include=optional

      - name: Build Web Assets
        run: npm run build

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Capacitor Sync & Production Config
        run: |
          npx cap add android || true
          npx cap sync android
          
          # Stable Versioning for Play Store
          VERSION_CODE=${{ github.run_number }}
          VERSION_NAME="1.0.${{ github.run_number }}"
          
          echo "Setting Version Code to $VERSION_CODE"
          echo "Setting Version Name to $VERSION_NAME"
          
          # Use a safer regex to update versioning without breaking the file
          sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i "s/versionName \"[0-9.]*\"/versionName \"$VERSION_NAME\"/" android/app/build.gradle

      - name: Build Production App Bundle (AAB) & APK
        run: |
          cd android
          chmod +x gradlew
          # build both AAB (Play Store) and APK (Testing)
          ./gradlew bundleRelease assembleRelease --stacktrace

      - name: Upload Play Store Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: ChargeGuard-Pro-v1.0.${{ github.run_number }}-PlayStore-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload Installation APK
        uses: actions/upload-artifact@v4
        with:
          name: ChargeGuard-Pro-v1.0.${{ github.run_number }}-APK
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
