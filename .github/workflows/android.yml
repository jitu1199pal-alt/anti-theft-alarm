name: Build Native Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Deep Clean and Install
        run: |
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps --include=optional

      - name: Build Web Assets
        run: npm run build

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Capacitor Sync & Fix Wrapper
        run: |
          npx cap sync android
          cd android
          rm -rf gradle/wrapper/gradle-wrapper.jar
          mkdir -p gradle/wrapper
          
          # Download gradle wrapper with retry logic and verification
          MAX_RETRIES=3
          RETRY_COUNT=0
          until curl -L --fail --retry 3 --retry-delay 2 \
            https://github.com/gradle/gradle/raw/v8.5.0/gradle/wrapper/gradle-wrapper.jar \
            -o gradle/wrapper/gradle-wrapper.jar; do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
              echo "Failed to download gradle-wrapper.jar after $MAX_RETRIES attempts"
              exit 1
            fi
            echo "Retry $RETRY_COUNT/$MAX_RETRIES..."
            sleep 5
          done
          
          # Verify the file exists and has content
          if [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
            echo "ERROR: gradle-wrapper.jar is empty or missing"
            exit 1
          fi
          
          ls -lh gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew

      - name: Build Play Store Bundle (AAB) & Testing APK
        run: |
          cd android
          # Build both AAB for Play Store and Debug APK for manual installation/testing
          ./gradlew clean bundleRelease assembleDebug \
            -Pandroid.injected.version.code=${{ github.run_number }} \
            -Pandroid.injected.version.name="1.0.${{ github.run_number }}" \
            --stacktrace

      - name: Upload Play Store Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: ChargeGuard-Pro-v1.0.${{ github.run_number }}-PlayStore-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload Testing APK (Installable)
        uses: actions/upload-artifact@v4
        with:
          name: ChargeGuard-Pro-v1.0.${{ github.run_number }}-Testing-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
