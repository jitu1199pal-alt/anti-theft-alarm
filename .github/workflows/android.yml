name: Build Native Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Deep Clean and Install
        run: |
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps --include=optional

      - name: Build Web Assets
        run: npm run build

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Capacitor Sync & Production Config
        run: |
          npx cap add android || true
          npx cap sync android
          # Precision replacement for versioning to avoid corrupting build.gradle
          echo "Updating build.gradle versioning..."
          sed -i 's/versionCode [0-9]*/versionCode ${{ github.run_number }}/g' android/app/build.gradle
          sed -i 's/versionName "[0-9.]*"/versionName "1.0.${{ github.run_number }}"/g' android/app/build.gradle
          # Verify the change
          grep "versionCode" android/app/build.gradle

      - name: Build Production APK (Unsigned)
        run: |
          cd android
          chmod +x gradlew
          # Clean before build and use release variant
          ./gradlew clean assembleRelease --stacktrace --info

      - name: Upload Production APK
        uses: actions/upload-artifact@v4
        with:
          name: ChargeGuard-Pro-v1.0.${{ github.run_number }}-Build-${{ github.run_id }}
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
