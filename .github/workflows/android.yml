name: Build Native Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEY != '' }}

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Deep Clean and Install
        run: |
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps --include=optional

      - name: Build Web Assets
        run: npm run build

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
          validate-wrappers: false

      - name: Update Gradle Wrapper
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.7 --distribution-type all
          chmod +x gradlew

      - name: Prepare and Decode Keystore File
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "=== Diagnostic Check: Verifying Secrets Presence ==="
          if [ -z "$SIGNING_KEY" ]; then
            echo "⚠️ SIGNING_KEY secret is MISSING or EMPTY! Build will fall back to unsigned."
          else
            echo "✅ SIGNING_KEY secret is present."
          fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "⚠️ KEYSTORE_PASSWORD secret is MISSING or EMPTY!"
          fi
          if [ -z "$ALIAS" ]; then
            echo "⚠️ ALIAS secret is MISSING or EMPTY!"
          fi
          if [ -z "$KEY_PASSWORD" ]; then
            echo "⚠️ KEY_PASSWORD secret is MISSING or EMPTY!"
          fi
          echo "=================================================="

          if [ -z "$SIGNING_KEY" ]; then
            echo "No SIGNING_KEY secret found. Fallback build will be unsigned."
          else
            echo "SIGNING_KEY found. Decoding cleanly into android/app/release.keystore..."
            mkdir -p android/app
            node -e "
              const fs = require('fs');
              const rawKey = process.env.SIGNING_KEY || '';
              const cleanKey = rawKey.replace(/[^A-Za-z0-9+/=]/g, '');
              fs.writeFileSync('android/app/release.keystore', Buffer.from(cleanKey, 'base64'));
            "
            echo "Keystore decoded successfully."
            ls -lh android/app/release.keystore
          fi

      - name: Build Android App Bundle and APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          if [ -f "app/release.keystore" ]; then
            echo "--- Detected release.keystore! Building Signed APK and Signed AAB ---"
            ./gradlew clean bundleRelease assembleRelease \
              -Pandroid.injected.version.code=${{ github.run_number }} \
              -Pandroid.injected.version.name="1.0.${{ github.run_number }}" \
              --stacktrace
          else
            echo "--- No release.keystore found. Building fallback Unsigned AAB and Debug Testing APK ---"
            ./gradlew clean bundleRelease assembleDebug \
              -Pandroid.injected.version.code=${{ github.run_number }} \
              -Pandroid.injected.version.name="1.0.${{ github.run_number }}" \
              --stacktrace
          fi

      - name: Upload Signed Release APK (Direct Install)
        if: env.HAS_SIGNING_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Charging-Alarm-Pro-v1.0.${{ github.run_number }}-Signed-APK
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload Signed Play Store Bundle (AAB)
        if: env.HAS_SIGNING_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Charging-Alarm-Pro-v1.0.${{ github.run_number }}-Signed-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload Unsigned Play Store Bundle (AAB) (Fallback)
        if: env.HAS_SIGNING_KEY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Charging-Alarm-Pro-v1.0.${{ github.run_number }}-Unsigned-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload Testing APK (Fallback Installable)
        if: env.HAS_SIGNING_KEY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Charging-Alarm-Pro-v1.0.${{ github.run_number }}-Testing-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
