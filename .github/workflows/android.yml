name: Build Native Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Deep Clean and Install
        run: |
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps --include=optional

      - name: Build Web Assets
        run: npm run build

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Capacitor Sync & Fix Wrapper
        run: |
          set -euo pipefail
          npx cap sync android
          cd android
          mkdir -p gradle/wrapper

          # If a wrapper already exists, keep it unless it's invalid
          VALID_WRAPPER=0
          if [ -s gradle/wrapper/gradle-wrapper.jar ]; then
            if unzip -l gradle/wrapper/gradle-wrapper.jar >/dev/null 2>&1; then
              echo "Existing gradle-wrapper.jar looks valid; keeping it."
              VALID_WRAPPER=1
            else
              echo "Existing gradle-wrapper.jar is invalid, will re-download."
              rm -f gradle/wrapper/gradle-wrapper.jar
            fi
          fi

          if [ $VALID_WRAPPER -eq 0 ]; then
            echo "Downloading gradle-wrapper.jar..."
            URL="https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar"
            MAX_RETRIES=5
            RETRY_COUNT=0
            until curl -fsSL --retry 3 --retry-delay 2 -o gradle/wrapper/gradle-wrapper.jar "$URL"; do
              RETRY_COUNT=$((RETRY_COUNT + 1))
              echo "Download attempt $RETRY_COUNT/$MAX_RETRIES failed."
              if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
                echo "Failed to download gradle-wrapper.jar after $MAX_RETRIES attempts"
                exit 1
              fi
              sleep 5
            done

            # Validate the downloaded file is a real JAR/Zip (unzip will error on HTML/text)
            if ! unzip -l gradle/wrapper/gradle-wrapper.jar >/dev/null 2>&1; then
              echo "ERROR: downloaded gradle-wrapper.jar is not a valid JAR (contains HTML/text)."
              echo "First 40 bytes of file for debugging:"
              head -c 240 gradle/wrapper/gradle-wrapper.jar | sed -n '1,20p' || true
              rm -f gradle/wrapper/gradle-wrapper.jar
              exit 1
            fi
          fi

          ls -lh gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew

      - name: Build Play Store Bundle (AAB) & Testing APK
        run: |
          cd android
          # Build both AAB for Play Store and Debug APK for manual installation/testing
          ./gradlew clean bundleRelease assembleDebug \
            -Pandroid.injected.version.code=${{ github.run_number }} \
            -Pandroid.injected.version.name="1.0.${{ github.run_number }}" \
            --stacktrace

      - name: Upload Play Store Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: ChargeGuard-Pro-v1.0.${{ github.run_number }}-PlayStore-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload Testing APK (Installable)
        uses: actions/upload-artifact@v4
        with:
          name: ChargeGuard-Pro-v1.0.${{ github.run_number }}-Testing-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
