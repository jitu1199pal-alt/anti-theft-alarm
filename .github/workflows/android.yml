name: Build Native Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Deep Clean and Install
        run: |
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps --include=optional

      - name: Build Web Assets
        run: npm run build

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
          validate-wrappers: false

      - name: Update Gradle Wrapper
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.7 --distribution-type all
          chmod +x gradlew

      - name: Build Play Store Bundle (AAB) & Testing APK
        run: |
          cd android
          # Build both AAB for Play Store and Debug APK for manual installation/testing
          ./gradlew clean bundleRelease assembleDebug \
            -Pandroid.injected.version.code=${{ github.run_number }} \
            -Pandroid.injected.version.name="1.0.${{ github.run_number }}" \
            --stacktrace

      - name: Sign App Bundle (AAB) for Google Play
        if: env.HAS_SIGNING_KEY == 'true'
        id: sign_app
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: android/app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEY != '' }}

      - name: Upload Signed Play Store Bundle (AAB)
        if: env.HAS_SIGNING_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Charging-Alarm-Pro-v1.0.${{ github.run_number }}-Signed-AAB
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
        env:
          HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEY != '' }}

      - name: Upload Unsigned Play Store Bundle (AAB) (Fallback)
        if: env.HAS_SIGNING_KEY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Charging-Alarm-Pro-v1.0.${{ github.run_number }}-Unsigned-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
        env:
          HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEY != '' }}

      - name: Upload Testing APK (Installable)
        uses: actions/upload-artifact@v4
        with:
          name: Charging-Alarm-Pro-v1.0.${{ github.run_number }}-Testing-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
