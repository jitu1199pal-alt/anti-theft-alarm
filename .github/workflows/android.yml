name: Build Native Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Deep Clean and Install
        run: |
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps --include=optional

      - name: Build Web Assets
        run: npm run build

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Capacitor Sync & Versioning
        run: |
          npx cap add android || true
          npx cap sync android
          # Auto-update version code based on GitHub Run ID for Play Store compliance
          sed -i 's/versionCode [0-9]*/versionCode ${{ github.run_number }}/' android/app/build.gradle
          sed -i 's/versionName "[0-9.]*"/versionName "1.0.${{ github.run_number }}"/' android/app/build.gradle

      - name: Build Release APK (Unsigned)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Upload Production APK
        uses: actions/upload-artifact@v4
        with:
          name: ChargeGuard-Pro-v1.0.${{ github.run_number }}-Release
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
