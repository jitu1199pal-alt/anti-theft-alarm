name: Build Native Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Deep Clean and Install
        run: |
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps --include=optional

      - name: Build Web Assets
        run: npm run build

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Capacitor Sync
        run: npx cap sync android

      
        working-directory: android
        run: |
          set -e
          VER=8.2.1
          # If wrapper jar missing or invalid, generate one using a downloaded Gradle distribution
          if ! unzip -l gradle/wrapper/gradle-wrapper.jar >/dev/null 2>&1; then
            echo "Gradle wrapper missing or invalid — generating wrapper (Gradle ${VER})"
            TMPDIR=$(mktemp -d)
            curl -fsSL "https://services.gradle.org/distributions/gradle-${VER}-bin.zip" -o "$TMPDIR/gradle.zip"
            unzip -q "$TMPDIR/gradle.zip" -d "$TMPDIR"
            "$TMPDIR"/gradle-${VER}/bin/gradle wrapper --gradle-version ${VER} --distribution-type all
            chmod +x gradlew
            rm -rf "$TMPDIR"
          else
            echo "Gradle wrapper exists and is valid"
          fi

      - name: Build Play Store Bundle (AAB) & Testing APK
        run: |
          cd android
          # Build both AAB for Play Store and Debug APK for manual installation/testing
          ./gradlew clean bundleRelease assembleDebug \
            -Pandroid.injected.version.code=${{ github.run_number }} \
            -Pandroid.injected.version.name="1.0.${{ github.run_number }}" \
            --stacktrace

      - name: Upload Play Store Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: ChargeGuard-Pro-v1.0.${{ github.run_number }}-PlayStore-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload Testing APK (Installable)
        uses: actions/upload-artifact@v4
        with:
          name: ChargeGuard-Pro-v1.0.${{ github.run_number }}-Testing-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
