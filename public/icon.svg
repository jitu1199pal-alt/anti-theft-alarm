<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="512" height="512">
  <!-- Background circle representing the deep space blue/indigo gradient -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="60%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  
  <!-- Outer decorative circle boundary -->
  <rect width="108" height="108" rx="24" fill="url(#bg-grad)"/>

  <!-- Golden outer ring of the badge -->
  <circle cx="54" cy="54" r="36" stroke="#FBBF24" stroke-width="2.5" fill="none"/>
  
  <!-- Inner blue neon accent ring -->
  <circle cx="54" cy="54" r="32" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.4" fill="none"/>

  <!-- Left bell ringing acoustic soundwaves -->
  <path d="M18,22 C13,29 13,39 18,46" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M22,25 C18,30 18,38 22,43" stroke="#FBBF24" stroke-width="1.2" stroke-linecap="round" fill="none"/>

  <!-- Right bell ringing acoustic soundwaves -->
  <path d="M90,22 C95,29 95,39 90,46" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M86,25 C90,30 90,38 86,43" stroke="#FBBF24" stroke-width="1.2" stroke-linecap="round" fill="none"/>

  <!-- Left Metallic Red Alarm Bell -->
  <g transform="translate(33, 28) rotate(-25)">
    <!-- Loop -->
    <path d="M-2,-7 C-2,-9 2,-9 2,-7" stroke="#EF4444" stroke-width="1" fill="none"/>
    <!-- Dome -->
    <path d="M-7,-1 C-7,-6 -4,-7 0,-7 C4,-7 7,-6 7,-1 L8,2 L-8,2 Z" fill="#EF4444" stroke="#B91C1C" stroke-width="0.8"/>
    <!-- Flare edge -->
    <rect x="-9" y="2" width="18" height="2" fill="#DC2626" />
    <!-- Golden striker -->
    <path d="M0,4 Q0,6 1,6" stroke="#F59E0B" stroke-width="1.2" fill="none"/>
  </g>

  <!-- Right Metallic Red Alarm Bell -->
  <g transform="translate(75, 28) rotate(25)">
    <!-- Loop -->
    <path d="M-2,-7 C-2,-9 2,-9 2,-7" stroke="#EF4444" stroke-width="1" fill="none"/>
    <!-- Dome -->
    <path d="M-7,-1 C-7,-6 -4,-7 0,-7 C4,-7 7,-6 7,-1 L8,2 L-8,2 Z" fill="#EF4444" stroke="#B91C1C" stroke-width="0.8"/>
    <!-- Flare edge -->
    <rect x="-9" y="2" width="18" height="2" fill="#DC2626" />
    <!-- Golden striker -->
    <path d="M0,4 Q0,6 -1,6" stroke="#F59E0B" stroke-width="1.2" fill="none"/>
  </g>

  <!-- Grounding power cord at the bottom -->
  <path d="M48,90 Q54,88 54,82" stroke="#10B981" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <polygon points="52,80 56,80 55,83 53,83" fill="#10B981"/>
  <rect x="53.5" y="77" width="1" height="3" fill="#9CA3AF"/>

  <!-- Black Smartphone Outer Frame -->
  <rect x="41" y="33" width="26" height="44" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <!-- Dark glossy screen boundaries -->
  <rect x="43" y="35.3" width="22" height="38.9" rx="2.7" fill="#020617"/>

  <!-- Battery charging visual container -->
  <rect x="51.5" y="43" width="5" height="1.5" fill="#10B981"/>
  <rect x="48" y="44" width="12" height="23" rx="1.5" stroke="#10B981" stroke-width="1.2" fill="#022C22"/>
  
  <!-- Solid green fully-charged battery fill -->
  <rect x="50" y="45.5" width="8" height="20" rx="1" fill="#10B981"/>
  
  <!-- Sleek light overlay reflection on the battery dome -->
  <rect x="50.5" y="45.5" width="1.5" height="20" fill="#FFFFFF" fill-opacity="0.35"/>

  <!-- Bright Energetic Yellow Strike Lightning Bolt -->
  <polygon points="55,47 49.5,56 53.5,56 52.5,64.5 58.5,55 54.5,55" fill="#FBBF24" stroke="#FFFFFF" stroke-width="0.5"/>

  <!-- High-contrast Theft Warning Triangle Accent at bottom-left page -->
  <polygon points="33,63 41,75 25,75" fill="#EF4444" stroke="#B91C1C" stroke-width="0.5"/>
  <!-- Triangle White exclamation mark -->
  <line x1="33" y1="67" x2="33" y2="71" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" />
  <circle cx="33" cy="73" r="0.8" fill="#FFFFFF"/>
</svg>
